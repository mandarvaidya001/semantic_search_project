<style>

/* reset default spacing */
body{
    margin:0;
    font-family:Arial, sans-serif;
    padding-top:70px;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    z-index:1000;
}

/* NAVBAR CONTAINER */
.nav-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

/* LOGO */
.logo{
    color:white;
    font-size:20px;
    font-weight:bold;
}

/* LINKS */
.nav-links a{
    color:white;
    margin-left:25px;
    text-decoration:none;
    font-weight:bold;
}

/* HOVER EFFECT */
.nav-links a:hover{
    color:#667eea;
}

</style>


<nav>

<div class="nav-container">

<div class="logo">
Semantic Search AI
</div>

<div class="nav-links">
<a href="/">Home</a>
<a href="/searchpage">Search</a>
<a href="/dataset">Dataset</a>
</div>

</div>

</nav>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semantic Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
       margin: 0;
  min-height: 100vh;
  background: linear-gradient(270deg, #0f2027, #203a43, #2c5364);
  background-size: 600% 600%;
  animation: gradientMove 12s ease infinite;
  display: flex;
  align-items: center;
  justify-content: center;
    }
    @keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


    .glass {
      width: 90%;
      max-width: 800px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.25);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg,#667eea,#764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 13px;
      color: #666;
    }

    .search-area {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102,126,234,0.2);
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg,#667eea,#764ba2);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102,126,234,0.4);
    }

    .examples {
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
    }

    #loading {
      text-align: center;
      font-weight: 600;
      display: none;
      margin: 10px 0;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .user {
      font-weight: 600;
      font-size: 14px;
    }

    .platform {
      font-size: 12px;
      color: #667eea;
    }

    .post {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .meta {
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #777;
    }

    @media (max-width: 700px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="glass">
  <div class="header">
    <div>
      <div class="logo">Semantic Search</div>
      <div class="tagline">AI-powered meaning based search</div>
    </div>
    <div class="tagline">v1.0</div>
  </div>
<div style="margin-bottom:10px;">
  <label>
    <input type="radio" name="mode" value="semantic" checked>
    Semantic Search (AI)
  </label>
  &nbsp;&nbsp;
  <label>
    <input type="radio" name="mode" value="keyword">
    Keyword Search
  </label>
</div>

  <div class="search-area">
    <input id="query" placeholder="Search anything...">
    <button onclick="search()">Search</button>
  </div>

  <div class="examples">
    Try: <b>heart doctor</b>, <b>sad feeling</b>, <b>exam stress</b>, <b>artificial intelligence</b>
  </div>


  <div id="loading">🔍 Searching with AI...</div>
  <div id="results" class="results-grid"></div>
<div id="meaningBox" style="margin:10px 0;font-weight:600;"></div>
  <div class="footer">
    Powered by Transformers + Cosine Similarity
  </div>
</div>

<script>
function search() {
  let q = document.getElementById("query").value;
  if (!q) return;

  let mode = document.querySelector('input[name="mode"]:checked').value;

  document.getElementById("loading").style.display = "block";
  document.getElementById("results").innerHTML = "";

 fetch(`/search?q=${q}&mode=${mode}`)
  .then(res => res.json())
  .then(data => {
    document.getElementById("loading").style.display = "none";

    document.getElementById("meaningBox").innerHTML =
      "🧠 AI understood meaning: " + data.meaning;

    let html = "";

    data.results.forEach(p => {
      html += `
        <div class="card">
          <div class="user">@${p.username}</div>
          <div class="platform">${p.platform}</div>
          <div class="post">${p.text}</div>
          <div class="meta">
            ❤️ ${p.likes} | Similarity: ${p.score.toFixed(2)}
          </div>
          <div style="font-size:12px;color:#555;margin-top:6px;">
            🧠 ${p.reason}
          </div>
        </div>
      `;
    });

    document.getElementById("results").innerHTML = html;
  });

}

</script>

</body>
</html>
